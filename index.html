<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#181818">
<meta name="mobile-web-app-capable" content="yes">
<title>مجلس الثلاثة</title>
<style>
  /* أسلوب واجهة Claude بألوان أسود رصاصي */
  :root{
    --bg:#181818; --panel:#212121; --surface:#2a2a2a; --line:#353535; --text:#ececec; --muted:#9a9a9a;
    --user:#2f2f2f; --claude:#d97757; --gemini:#6c9bf0; --ok:#5fae7b; --err:#d0564b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;font-size:16px}
  body{display:flex;flex-direction:column;height:100dvh}
  select,button,input,textarea{font:inherit;color:inherit}

  /* الشريط العلوي: بسيط وشفاف */
  header{display:flex;align-items:center;gap:6px;padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));background:var(--bg)}
  header h1{font-size:17px;font-weight:600;margin:0;flex:1;white-space:nowrap;letter-spacing:.2px}
  header h1::before{content:"✳ ";color:var(--claude)}
  select{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px}
  .icon{background:none;border:none;font-size:19px;padding:6px 8px;border-radius:10px;cursor:pointer;filter:grayscale(1) brightness(1.4)}
  .icon:active{background:var(--surface)}

  /* المحادثة: عمود في الوسط */
  main{flex:1;overflow-y:auto;padding:12px 16px 24px}
  main > *{max-width:760px;margin-inline:auto}
  #chat{display:flex;flex-direction:column;gap:18px}
  .msg{line-height:1.75;word-wrap:break-word;width:100%}
  .msg .who{font-size:13px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  /* رسائلك: فقاعة رمادية */
  .msg.user{align-self:flex-start;width:auto;max-width:85%;background:var(--user);
    padding:10px 14px;border-radius:20px}
  .msg.user .who{display:none}
  /* ردودنا: نص مفتوح بدون فقاعة، مثل Claude */
  .msg.claude, .msg.gemini{align-self:stretch;max-width:760px;padding:2px 2px}
  .msg.claude .who{color:var(--claude)}
  .msg.claude .who::before{content:"✳";font-size:16px}
  .msg.gemini .who{color:var(--gemini)}
  .msg.gemini .who::before{content:"✦";font-size:15px}
  .msg.summary{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
  .msg.error{align-self:center;width:auto;background:#3a2222;color:#ffd2cc;font-size:14px;padding:8px 12px;border-radius:12px}
  .msg.typing{opacity:.6;font-style:italic}
  .note{align-self:center;color:var(--muted);font-size:14px;text-align:center;line-height:1.9;margin-top:18vh}
  .note b{color:var(--text);font-size:20px;font-weight:600}

  /* صندوق الكتابة: مستطيل دائري فيه الأزرار، مثل Claude */
  footer{padding:8px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--bg)}
  .composer{max-width:760px;margin:0 auto;background:var(--panel);border:1px solid var(--line);
    border-radius:24px;padding:8px 10px 8px;box-shadow:0 2px 12px rgba(0,0,0,.35)}
  textarea{width:100%;resize:none;max-height:160px;min-height:28px;background:transparent;border:none;
    outline:none;padding:6px 6px;line-height:1.5}
  textarea::placeholder{color:var(--muted)}
  .tools{display:flex;align-items:center;gap:6px}
  .tools .spacer{flex:1}
  .round{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;
    font-size:17px;flex:none;cursor:pointer;display:grid;place-items:center}
  #attach{font-size:22px;font-weight:300}
  #mic{filter:grayscale(1) brightness(1.5)}
  #mic.rec{filter:none;background:var(--err);border-color:var(--err);animation:pulse 1s infinite}
  #send{background:var(--claude);border-color:var(--claude);color:#1a1a1a;font-weight:700;border-radius:12px}
  #send.stop{background:var(--text);border-color:var(--text)}
  @keyframes pulse{50%{opacity:.6}}

  /* المرفقات */
  #pending{display:none;gap:8px;padding:2px 2px 6px;overflow-x:auto}
  #pending.show{display:flex}
  .chip{position:relative;flex:none;border:1px solid var(--line);border-radius:12px;background:var(--surface);
    font-size:12px;max-width:150px;display:flex;align-items:center;gap:6px;padding:4px 22px 4px 6px}
  .chip img{width:44px;height:44px;object-fit:cover;border-radius:8px}
  .chip .x{position:absolute;top:2px;left:5px;cursor:pointer;opacity:.8}
  .chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .atts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .atts img{max-width:200px;max-height:200px;border-radius:12px;display:block}
  .atts .pdf{background:rgba(0,0,0,.3);border-radius:10px;padding:6px 10px;font-size:13px}

  /* نافذة الإعدادات */
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:18px;
    width:min(94vw,460px);max-height:90dvh;padding:18px}
  dialog::backdrop{background:rgba(0,0,0,.65)}
  dialog h2{margin:0 0 12px;font-size:18px;font-weight:600}
  label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
  dialog input[type=text],dialog input[type=password],dialog input[type=number]{
    width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;direction:ltr}
  .row{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
  .btns{display:flex;gap:8px;margin-top:16px}
  .btn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
  .btn.primary{background:var(--claude);border-color:var(--claude);color:#1a1a1a;font-weight:600}
  .btn.danger{background:#3a2222;border-color:#4a2a2a}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>مجلس الثلاثة</h1>
  <select id="mode" aria-label="طريقة الرد">
    <option value="both">يردّان مرة</option>
    <option value="debate">نقاش + خلاصة</option>
  </select>
  <button class="icon" id="ttsToggle" title="قراءة الردود بالصوت">🔇</button>
  <button class="icon" id="openSettings" title="الإعدادات">⚙️</button>
</header>

<main id="chat"></main>

<footer>
  <div class="composer">
    <div id="pending"></div>
    <textarea id="input" rows="1" placeholder="اكتب لكلاود وجيمي…"></textarea>
    <div class="tools">
      <button class="round" id="attach" title="إرفاق صورة أو PDF">+</button>
      <input type="file" id="fileInput" accept="image/*,application/pdf" multiple hidden>
      <button class="round" id="mic" title="تسجيل صوتي">🎙️</button>
      <span class="spacer"></span>
      <button class="round" id="send" title="إرسال">↑</button>
    </div>
  </div>
</footer>

<dialog id="settings">
  <h2>الإعدادات</h2>
  <label>مفتاح Claude (من console.anthropic.com)</label>
  <input type="password" id="claudeKey" autocomplete="off">
  <label>مفتاح Gemini (من aistudio.google.com)</label>
  <input type="password" id="geminiKey" autocomplete="off">
  <label>نموذج Claude</label>
  <input type="text" id="claudeModel">
  <label>نموذج Gemini</label>
  <input type="text" id="geminiModel">
  <div class="hint">إذا ظهر خطأ «model not found» غيّر اسم النموذج هنا فقط.</div>
  <label>مفتاح OpenRouter (اختياري — Gemini مدفوع بدون ازدحام)</label>
  <input type="password" id="orKey" autocomplete="off">
  <label>نموذج Gemini عبر OpenRouter</label>
  <input type="text" id="orModel">
  <div class="hint">إذا وضعت مفتاح OpenRouter، يرد Gemini عبره. اتركه فارغاً لتبقى على مفتاح Google المجاني.</div>
  <label>عدد جولات النقاش (في وضع «نقاش + خلاصة»)</label>
  <input type="number" id="rounds" min="1" max="5">
  <div class="row"><input type="checkbox" id="autoSend"> <span>إرسال الرسالة الصوتية مباشرة بعد التسجيل</span></div>
  <div class="hint">المفاتيح والمحادثات تُحفظ على هذا الهاتف فقط.</div>
  <div class="btns">
    <button class="btn primary" id="saveSettings">حفظ</button>
    <button class="btn" id="closeSettings">إغلاق</button>
  </div>
  <div class="btns">
    <button class="btn danger" id="clearChat">مسح المحادثة</button>
  </div>
</dialog>

<script>
/* ===== التخزين ===== */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const DEFAULTS = { orKey:'', orModel:'google/gemini-3.1-pro-preview', claudeKey:'', geminiKey:'', claudeModel:'claude-sonnet-5-5',
  geminiModel:'gemini-3.8-flash', rounds:2, autoSend:false, tts:false, mode:'both' };
let S = Object.assign({}, DEFAULTS, store.get('majlis_settings', {}));
let history = store.get('majlis_history', []);
let nextFirst = store.get('majlis_nextFirst', 'claude');
const saveAll = () => { store.set('majlis_settings', S); store.set('majlis_history', history); store.set('majlis_nextFirst', nextFirst); };

/* ===== الأسماء والتعليمات ===== */
const LABEL = { user:'المستخدم', claude:'Claude', gemini:'Gemini' };
const SHOWN = { user:'أنت', claude:'Claude', gemini:'Gemini' };
const other = w => w === 'claude' ? 'gemini' : 'claude';
const NICKS = { claude:'Claude أو كلاود أو كلود', gemini:'Gemini أو جيميناي أو جيمي أو جمناي' };
const NAMES_RE = {
  claude: /claude|كلاود|كلود|كلاد/,
  gemini: /gemini|جيميناي|جيمناي|جمناي|جيمني|جميني|جيمي|جمني/
};

function systemPrompt(me){
  const o = LABEL[other(me)];
  return `أنت ${LABEL[me]} في غرفة نقاش جماعية مع المستخدم ومع ${o}. هدف هذه الغرفة الوصول إلى أفضل فكرة في كل نقاش.
المستخدم قد يناديك باسمك بالعربي أو بالإنجليزي: ${NICKS[me]}. وينادي ${o} بـ: ${NICKS[other(me)]}. انتبه لمن يوجَّه الكلام.
اقرأ ما كتبه الطرف الآخر قبل الرد. لا تجامل ولا تكرر ما قيل؛ إذا اختلفت فاذكر السبب مباشرة، وإذا اتفقت فأضف زاوية جديدة أو خطوة عملية.
اجعل ردودك قصيرة ومركزة كأننا في جلسة عصف ذهني حية.
رد بنفس لغة ولهجة المستخدم.
الرسائل تصلك موسومة بأسماء أصحابها مثل [المستخدم] و[${o}]. لا تكتب وسم اسمك في بداية ردك، التطبيق يضيفه.
لا تتكلم نيابةً عن ${o} ولا تكتب رده.
خاطب المستخدم مباشرة بصيغة «أنت»، ولا تكتب «@المستخدم» أو «[المستخدم]» في ردك.`;
}

/* يحوّل السجل المشترك إلى أدوار يفهمها كل نموذج: رسائله = assistant، والباقي = user موسوم بالاسم */
/* كل دور = { role, text, atts:[{mime,data,name}] }
   المرفقات تُرسل كاملة فقط لآخر 3 رسائل فيها مرفقات (لتوفير التكلفة)، والأقدم يُذكر اسمها فقط */
async function buildTurns(me, extra){
  const turns = [];
  const recent = history.slice(-60);
  const withAtts = recent.filter(m => m.atts && m.atts.length).slice(-3);
  for (const m of recent){
    const role = m.who === me ? 'assistant' : 'user';
    let text = role === 'assistant' ? m.text : `[${LABEL[m.who]}]: ${m.text}`;
    const atts = [];
    if (m.atts && m.atts.length){
      if (withAtts.includes(m)){
        for (const a of m.atts){
          const data = await attGet(a.id);
          if (data) atts.push({ mime:a.mime, name:a.name, data });
          else text += `\n[مرفق لم يعد متوفراً: ${a.name}]`;
        }
      } else {
        text += '\n' + m.atts.map(a => `[مرفق سابق: ${a.name}]`).join(' ');
      }
    }
    const last = turns[turns.length-1];
    if (last && last.role === role){ last.text += '\n\n' + text; last.atts.push(...atts); }
    else turns.push({ role, text, atts });
  }
  while (turns.length && turns[0].role === 'assistant') turns.shift();
  if (extra){
    const last = turns[turns.length-1];
    if (last && last.role === 'user') last.text += '\n\n[ملاحظة من التطبيق]: ' + extra;
    else turns.push({ role:'user', text:'[ملاحظة من التطبيق]: ' + extra, atts:[] });
  }
  // المرفقات لا تُرسل إلا في أدوار المستخدم
  turns.forEach(t => { if (t.role === 'assistant') t.atts = []; });
  return turns;
}

/* ===== تخزين المرفقات في IndexedDB (localStorage صغير جداً للصور) ===== */
let _db = null;
function attDB(){
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open('majlis_files', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('files');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return _db;
}
async function attPut(id, data){
  const db = await attDB();
  return new Promise((res, rej) => { const tx = db.transaction('files','readwrite');
    tx.objectStore('files').put(data, id); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
}
async function attGet(id){
  try{ const db = await attDB();
    return await new Promise(res => { const q = db.transaction('files').objectStore('files').get(id);
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); });
  }catch(e){ return null; }
}
async function attClear(){
  try{ const db = await attDB();
    await new Promise(res => { const tx = db.transaction('files','readwrite'); tx.objectStore('files').clear(); tx.oncomplete = res; tx.onerror = res; });
  }catch(e){}
}

/* ===== الاتصال بالنماذج ===== */
async function callClaude(turns, system){
  if (!S.claudeKey) throw new Error('ضع مفتاح Claude في الإعدادات ⚙️');
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST', signal: aborter ? aborter.signal : undefined,
    headers:{ 'content-type':'application/json', 'x-api-key':S.claudeKey,
      'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
    body: JSON.stringify({ model:S.claudeModel, max_tokens:1500, system,
      messages: turns.map(t => ({ role:t.role, content: t.atts && t.atts.length
        ? [ ...t.atts.map(a => a.mime === 'application/pdf'
              ? { type:'document', source:{ type:'base64', media_type:a.mime, data:a.data } }
              : { type:'image', source:{ type:'base64', media_type:a.mime, data:a.data } }),
            { type:'text', text:t.text } ]
        : t.text })) })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('Claude: ' + (d.error && d.error.message || r.status));
  return (d.content || []).filter(b => b.type === 'text').map(b => b.text).join('').trim();
}

// نماذج احتياطية إذا كان النموذج الأساسي مزدحماً أو غير متاح
const GEMINI_FALLBACKS = ['gemini-3.6-flash', 'gemini-3.5-flash-lite', 'gemini-2.5-flash'];
const sleep = ms => new Promise(r => setTimeout(r, ms));
let lastModel = '', typingEl = null;
function setStatus(t){ if (typingEl) typingEl.lastChild.textContent = t; }

function genConfig(model){
  // thinkingLevel لنماذج Gemini 3 فقط؛ النماذج الأقدم (2.5) لا تقبله
  return /^gemini-[3-9]/.test(model)
    ? { maxOutputTokens:4000, thinkingConfig:{ thinkingLevel:'low' } }
    : { maxOutputTokens:4000 };
}

async function geminiRequest(body, withConfig){
  if (!S.geminiKey) throw new Error('ضع مفتاح Gemini في الإعدادات ⚙️');
  // نبدأ بآخر نموذج نجح خلال آخر 15 دقيقة، حتى لا نضيّع وقتاً على نموذج مزدحم
  const sticky = store.get('majlis_gemini_ok', null);
  const first = (sticky && Date.now() - sticky.t < 15*60*1000) ? sticky.m : S.geminiModel;
  const models = [...new Set([first, S.geminiModel, ...GEMINI_FALLBACKS])];
  let lastErr = '';
  for (let i = 0; i < models.length; i++){
    const model = models[i];
    const payload = withConfig ? Object.assign({}, body, { generationConfig: genConfig(model) }) : body;
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
    // مهلة 20 ثانية لكل محاولة، مع بقاء زر الإيقاف فعّالاً
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort('timeout'), 20000);
    const onStop = () => ctl.abort('stop');
    if (aborter) aborter.signal.addEventListener('abort', onStop);
    let r, d;
    try{
      setStatus(`Gemini يكتب… (${model})`);
      r = await fetch(url, { method:'POST', signal: ctl.signal,
        headers:{ 'content-type':'application/json', 'x-goog-api-key':S.geminiKey },
        body: JSON.stringify(payload) });
      d = await r.json().catch(() => ({}));
    }catch(e){
      if (aborter && aborter.signal.aborted) throw e;      // المستخدم ضغط إيقاف
      lastErr = `${model}: لم يرد خلال 20 ثانية`;
      continue;                                             // مهلة انتهت: جرّب النموذج التالي
    }finally{
      clearTimeout(timer);
      if (aborter) aborter.signal.removeEventListener('abort', onStop);
    }
    if (r.ok){
      const parts = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
      lastModel = model;
      store.set('majlis_gemini_ok', { m:model, t:Date.now() });
      return parts.map(p => p.text || '').join('').trim();
    }
    lastErr = d.error && d.error.message || r.status;
    // ازدحام (503) أو حد الاستخدام (429) أو نموذج غير موجود (404): نجرب التالي
    if (![429, 500, 503, 404].includes(r.status)) break;
  }
  throw new Error('Gemini: ' + lastErr);
}

async function callOpenRouter(turns, system){
  setStatus(`Gemini يكتب… (${S.orModel})`);
  const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
    method:'POST', signal: aborter ? aborter.signal : undefined,
    headers:{ 'content-type':'application/json', 'authorization':'Bearer ' + S.orKey,
      'X-Title':'Majlis' },
    body: JSON.stringify({ model:S.orModel, max_tokens:4000, reasoning:{ effort:'low' },
      messages:[{ role:'system', content:system }, ...turns.map(t => ({ role:t.role, content: t.atts && t.atts.length
        ? [ ...t.atts.map(a => a.mime === 'application/pdf'
              ? { type:'file', file:{ filename:a.name, file_data:`data:${a.mime};base64,${a.data}` } }
              : { type:'image_url', image_url:{ url:`data:${a.mime};base64,${a.data}` } }),
            { type:'text', text:t.text } ]
        : t.text }))] })
  });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error('OpenRouter: ' + (d.error && d.error.message || r.status));
  lastModel = (d.model || S.orModel).replace(/^google\//, '');
  const msg = d.choices && d.choices[0] && d.choices[0].message;
  return (msg && msg.content || '').trim();
}

function callGemini(turns, system){
  if (S.orKey) return callOpenRouter(turns, system);
  return geminiRequest({
    systemInstruction:{ parts:[{ text:system }] },
    contents: turns.map(t => ({ role: t.role === 'assistant' ? 'model' : 'user',
      parts:[ ...(t.atts || []).map(a => ({ inlineData:{ mimeType:a.mime, data:a.data } })), { text:t.text } ] }))
  }, true);
}

/* ===== الواجهة ===== */
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function esc(s){ return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>'); }

function bubble(who, text, cls, model, atts){
  const div = document.createElement('div');
  div.className = 'msg ' + who + (cls ? ' ' + cls : '');
  const tag = model ? ` <span style="font-weight:400;opacity:.6;font-size:11px;direction:ltr;unicode-bidi:isolate">· ${esc(model.replace(/^gemini-|^claude-/,''))}</span>` : '';
  div.innerHTML = (who !== 'error' ? `<div class="who">${SHOWN[who] || ''}${cls==='summary' ? ' · الخلاصة' : ''}${tag}</div>` : '') + fmt(text);
  if (atts && atts.length){
    const box = document.createElement('div'); box.className = 'atts';
    atts.forEach(a => {
      if (a.mime === 'application/pdf'){
        const p = document.createElement('div'); p.className = 'pdf'; p.textContent = '📄 ' + a.name; box.appendChild(p);
      } else {
        const img = document.createElement('img'); img.alt = a.name; box.appendChild(img);
        attGet(a.id).then(d => { if (d) img.src = `data:${a.mime};base64,${d}`; else img.replaceWith(Object.assign(document.createElement('div'), { className:'pdf', textContent:'🖼️ ' + a.name })); });
      }
    });
    const whoEl = div.querySelector('.who');
    if (whoEl) whoEl.after(box); else div.prepend(box);
  }
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}
function renderAll(){
  chat.innerHTML = '';
  if (!history.length){
    const n = document.createElement('div'); n.className = 'note';
    n.innerHTML = '<b>✳ مجلس الثلاثة</b><br>اكتب فكرتك أو سجّلها بصوتك.<br>«يردّان مرة»: كل واحد يرد بالدور.<br>«نقاش + خلاصة»: يتناقشان فيما بينهما ثم يعطونك الخلاصة.';
    chat.appendChild(n);
  }
  history.forEach(m => bubble(m.who, m.text, m.summary ? 'summary' : '', m.model, m.atts));
}

/* ===== منطق المحادثة ===== */
let busy = false, stopRequested = false, aborter = null;

async function speak(who, extra, isSummary){
  const typing = bubble(who, '…يكتب', 'typing');
  typingEl = typing; lastModel = '';
  aborter = new AbortController();
  try{
    const turns = await buildTurns(who, extra);
    const sys = systemPrompt(who);
    const text = who === 'claude' ? await callClaude(turns, sys) : await callGemini(turns, sys);
    typing.remove();
    // رد فارغ أو [تم] = لا يوجد شيء جديد يضيفه: نتجاوزه بهدوء وننهي النقاش
    if (!text || /^\[?\s*تم\s*\]?\.?$/.test(text)) return 'done';
    const m = { who, text, ts:Date.now(), model: who === 'claude' ? S.claudeModel : lastModel };
    if (isSummary) m.summary = true;
    history.push(m); saveAll();
    bubble(who, text, isSummary ? 'summary' : '', m.model);
    say(who, text);
  }catch(e){
    typing.remove();
    bubble('error', e.name === 'AbortError' ? '⏹ تم إيقاف النقاش' : '⚠️ ' + e.message);
    throw e;
  }finally{
    aborter = null; typingEl = null;
  }
}

function detectTarget(text){
  const t = text.toLowerCase();
  // الاسم يكفي، مع @ أو بدونها، بالعربي أو بالإنجليزي
  const c = NAMES_RE.claude.test(t), g = NAMES_RE.gemini.test(t);
  if (c && !g) return 'claude';
  if (g && !c) return 'gemini';
  return null;
}

async function send(){
  let text = input.value.trim();
  if ((!text && !pending.length) || busy) return;
  if (!text) text = pending.some(a => a.mime === 'application/pdf') ? 'شوفوا هذا الملف' : 'شوفوا هذه الصورة';
  input.value = ''; autoGrow();
  const atts = [];
  for (const a of pending){
    const id = 'f' + Date.now() + Math.random().toString(36).slice(2, 7);
    try{ await attPut(id, a.data); atts.push({ id, mime:a.mime, name:a.name }); }
    catch(e){ bubble('error', '⚠️ تعذر حفظ المرفق: ' + a.name); }
  }
  pending = []; renderPending();
  const um = { who:'user', text, ts:Date.now() };
  if (atts.length) um.atts = atts;
  history.push(um); saveAll();
  if (history.length === 1) renderAll(); else bubble('user', text, '', '', atts);

  busy = true; stopRequested = false; setSendState();
  try{
    const target = detectTarget(text);
    const ready = ['claude','gemini'].filter(w => w === 'claude' ? S.claudeKey : (S.geminiKey || S.orKey));
    if (target){
      await speak(target);
    } else if (ready.length < 2){
      // إذا كان مفتاح واحد فقط موجوداً، يرد صاحبه وحده بدل أن تتوقف المحادثة
      if (!ready.length) throw (bubble('error', '⚠️ ضع مفتاحاً واحداً على الأقل في الإعدادات ⚙️'), new Error('no keys'));
      bubble('error', `ℹ️ مفتاح ${LABEL[other(ready[0])]} غير موجود، سيرد ${LABEL[ready[0]]} وحده`);
      await speak(ready[0]);
    } else {
      const a = nextFirst, b = other(a);
      nextFirst = b; saveAll();   // نبدّل من يبدأ كل مرة حتى لا يتأثر أحد دائماً بالآخر
      // الرسائل القصيرة (تمام، شكراً، اسكتوا...) لا تحتاج نقاشاً
      const isShort = text.replace(/\s+/g,' ').length < 25;
      const EXIT = ' إذا لم يكن عندك شيء جديد ومفيد تضيفه، أو طلب المستخدم التوقف، اكتب فقط: [تم]';
      if (S.mode === 'debate' && !isShort){
        const rounds = Math.max(1, Math.min(5, +S.rounds || 2));
        let ended = false;
        for (let r = 0; r < rounds && !stopRequested && !ended; r++){
          if (await speak(a, r > 0 ? `هذه الجولة ${r+1} من النقاش: رد مباشرة على آخر ما قاله ${LABEL[b]}، طوّر الفكرة أو انتقدها.` + EXIT : null) === 'done') { ended = true; break; }
          if (stopRequested) break;
          if (await speak(b, `هذه جولة نقاش: رد مباشرة على ما قاله ${LABEL[a]}، وافق أو خالف مع السبب، وطوّر الفكرة.` + EXIT) === 'done') { ended = true; break; }
        }
        if (!stopRequested)
          await speak(a, 'انتهت جولات النقاش. اكتب الآن للمستخدم الخلاصة النهائية: أفضل فكرة توصلنا لها، نقاط الاتفاق، وأي خلاف بقي بينكما مع رأي كل طرف. بإيجاز ووضوح.', true);
      } else {
        const shortNote = isShort ? 'رسالة المستخدم قصيرة: رد بإيجاز شديد.' + EXIT : null;
        await speak(a, shortNote);
        if (!stopRequested) await speak(b, shortNote);
      }
    }
  }catch(e){ /* الخطأ ظاهر في الشات */ }
  busy = false; setSendState();
}

function setSendState(){
  sendBtn.textContent = busy ? '■' : '↑';
  sendBtn.classList.toggle('stop', busy);
  sendBtn.title = busy ? 'إيقاف النقاش' : 'إرسال';
}
sendBtn.onclick = () => {
  if (busy){ stopRequested = true; if (aborter) aborter.abort(); sendBtn.textContent = '…'; }
  else send();
};
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches){ e.preventDefault(); send(); } });
function autoGrow(){ input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 140) + 'px'; }
input.addEventListener('input', autoGrow);

/* ===== الصوت: تسجيل → Gemini يفرّغه إلى نص ===== */
const micBtn = document.getElementById('mic');
let recorder = null, chunks = [];

micBtn.onclick = async () => {
  if (recorder && recorder.state === 'recording'){ recorder.stop(); return; }
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
    chunks = [];
    recorder = new MediaRecorder(stream);
    recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      micBtn.classList.remove('rec'); micBtn.textContent = '⏳'; micBtn.disabled = true;
      try{
        const wav = await blobToWav(new Blob(chunks, { type: recorder.mimeType }));
        const text = await geminiRequest({ contents:[{ role:'user', parts:[
          { inlineData:{ mimeType:'audio/wav', data: await toBase64(wav) } },
          { text:'فرّغ هذا التسجيل الصوتي إلى نص مكتوب كما قيل حرفياً وبنفس اللهجة (غالباً عراقية). أعد النص فقط بدون أي شرح أو إضافة.' }
        ]}]});
        input.value = (input.value ? input.value + ' ' : '') + text; autoGrow();
        if (S.autoSend && text) send(); else input.focus();
      }catch(e){ bubble('error', '⚠️ التسجيل: ' + e.message); }
      micBtn.textContent = '🎙️'; micBtn.disabled = false;
    };
    recorder.start();
    micBtn.classList.add('rec'); micBtn.textContent = '⏹';
  }catch(e){ bubble('error', '⚠️ لا يمكن الوصول للمايكروفون: ' + e.message); }
};

/* يحوّل التسجيل إلى WAV أحادي 16kHz لأن Gemini يقبله بثبات */
async function blobToWav(blob){
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  const audio = await ctx.decodeAudioData(await blob.arrayBuffer());
  ctx.close();
  const rate = 16000, len = Math.max(1, Math.ceil(audio.duration * rate));
  const off = new OfflineAudioContext(1, len, rate);
  const src = off.createBufferSource(); src.buffer = audio; src.connect(off.destination); src.start();
  const pcm = (await off.startRendering()).getChannelData(0);
  const buf = new ArrayBuffer(44 + pcm.length * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + pcm.length*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, pcm.length*2, true);
  for (let i = 0; i < pcm.length; i++){ const s = Math.max(-1, Math.min(1, pcm[i])); v.setInt16(44 + i*2, s < 0 ? s*0x8000 : s*0x7fff, true); }
  return new Blob([buf], { type:'audio/wav' });
}
async function toBase64(blob){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/* ===== قراءة الردود بالصوت (صوت مختلف لكل واحد) ===== */
const ttsBtn = document.getElementById('ttsToggle');
function updateTtsBtn(){ ttsBtn.textContent = S.tts ? '🔊' : '🔇'; }
ttsBtn.onclick = () => { S.tts = !S.tts; saveAll(); updateTtsBtn(); if (!S.tts && window.speechSynthesis) speechSynthesis.cancel(); };
function say(who, text){
  if (!S.tts || !window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text.replace(/[*#_`>\[\]]/g, ''));
  const ar = speechSynthesis.getVoices().filter(v => /^ar/i.test(v.lang));
  u.lang = 'ar';
  if (ar.length) u.voice = who === 'claude' ? ar[0] : (ar[1] || ar[0]);
  u.pitch = who === 'claude' ? 1.0 : 0.75;
  u.rate = 1.0;
  speechSynthesis.speak(u);
}

/* ===== المرفقات: صور و PDF ===== */
let pending = [];   // { mime, name, data(base64), thumb }
const pendingEl = document.getElementById('pending');
const fileInput = document.getElementById('fileInput');
document.getElementById('attach').onclick = () => fileInput.click();
fileInput.onchange = async () => {
  for (const f of fileInput.files){
    try{
      if (f.type === 'application/pdf'){
        if (f.size > 20 * 1024 * 1024){ bubble('error', '⚠️ ملف PDF أكبر من 20MB: ' + f.name); continue; }
        pending.push({ mime:'application/pdf', name:f.name, data: await toBase64(f) });
      } else if (f.type.startsWith('image/')){
        const data = await shrinkImage(f);
        pending.push({ mime:'image/jpeg', name:f.name, data, thumb:`data:image/jpeg;base64,${data}` });
      }
    }catch(e){ bubble('error', '⚠️ تعذر قراءة الملف: ' + f.name); }
  }
  fileInput.value = '';
  renderPending();
};
function renderPending(){
  pendingEl.innerHTML = '';
  pendingEl.classList.toggle('show', pending.length > 0);
  pending.forEach((a, i) => {
    const c = document.createElement('div'); c.className = 'chip';
    c.innerHTML = a.thumb ? `<img src="${a.thumb}">` : `<span>📄 ${esc(a.name)}</span>`;
    const x = document.createElement('span'); x.className = 'x'; x.textContent = '✕';
    x.onclick = () => { pending.splice(i, 1); renderPending(); };
    c.appendChild(x); pendingEl.appendChild(c);
  });
}
/* تصغير صور الهاتف الكبيرة إلى 1600px لتقليل الحجم والتكلفة */
function shrinkImage(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

/* ===== الإعدادات ===== */
const dlg = document.getElementById('settings');
const F = id => document.getElementById(id);
document.getElementById('openSettings').onclick = () => {
  F('claudeKey').value = S.claudeKey; F('geminiKey').value = S.geminiKey;
  F('orKey').value = S.orKey; F('orModel').value = S.orModel;
  F('claudeModel').value = S.claudeModel; F('geminiModel').value = S.geminiModel;
  F('rounds').value = S.rounds; F('autoSend').checked = !!S.autoSend;
  dlg.showModal();
};
F('closeSettings').onclick = () => dlg.close();
F('saveSettings').onclick = () => {
  S.claudeKey = F('claudeKey').value.trim(); S.geminiKey = F('geminiKey').value.trim();
  S.orKey = F('orKey').value.trim(); S.orModel = F('orModel').value.trim() || DEFAULTS.orModel;
  S.claudeModel = F('claudeModel').value.trim() || DEFAULTS.claudeModel;
  S.geminiModel = F('geminiModel').value.trim() || DEFAULTS.geminiModel;
  S.rounds = +F('rounds').value || 2; S.autoSend = F('autoSend').checked;
  store.set('majlis_gemini_ok', null);   // بعد تغيير الإعدادات نبدأ من النموذج المختار
  saveAll(); dlg.close();
};
F('clearChat').onclick = () => { if (confirm('مسح كل المحادثة؟')){ history = []; saveAll(); attClear(); renderAll(); dlg.close(); } };

const modeSel = document.getElementById('mode');
modeSel.value = S.mode;
modeSel.onchange = () => { S.mode = modeSel.value; saveAll(); };

updateTtsBtn(); setSendState(); renderAll();
if (!S.claudeKey || !(S.geminiKey || S.orKey)) setTimeout(() => document.getElementById('openSettings').click(), 300);
</script>
